# Build Desktop App for macOS
#
# Builds the Electron desktop app for macOS (DMG)
#
name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'file:./prisma/data/voiceinvoice.db'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build --filter=@voiceinvoice/shared-types --filter=@voiceinvoice/privacy-engine --filter=@voiceinvoice/database --filter=@voiceinvoice/ai-orchestrator

      - name: Generate Prisma client
        working-directory: apps/desktop
        run: pnpm exec prisma generate

      - name: Setup database with seed data
        working-directory: apps/desktop
        env:
          DATABASE_URL: 'file:./prisma/data/voiceinvoice.db'
        run: |
          mkdir -p prisma/data
          pnpm exec prisma db push --skip-generate
          pnpm exec tsx prisma/seed.ts

      - name: Build Electron
        working-directory: apps/desktop
        run: node scripts/build-electron.mjs

      - name: Build Next.js
        working-directory: apps/desktop
        env:
          DATABASE_URL: 'file:./prisma/data/voiceinvoice.db'
        run: pnpm exec next build

      - name: Prepare standalone
        working-directory: apps/desktop
        run: node scripts/prepare-standalone.mjs

      - name: Build macOS installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/release/*.dmg
          if-no-files-found: warn
          retention-days: 30
