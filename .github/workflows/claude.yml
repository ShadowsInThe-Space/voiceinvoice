name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Trigger nur bei @claude Erwähnung - diese Prüfung ist sicher da sie
    # keine Shell-Kommandos ausführt, sondern nur GitHub's Expression-Syntax nutzt
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth Token für Claude Pro/Max Abo
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Konfiguriere Claude für dieses TypeScript/Electron Projekt
          claude_args: |
            --allowedTools "Bash(pnpm install),Bash(pnpm run build),Bash(pnpm test),Bash(pnpm lint),Bash(pnpm typecheck)"
            --system-prompt "Du arbeitest an VoiceInvoice, einer Electron + Next.js 14 App. Nutze TypeScript, folge den Coding Standards in CLAUDE.md. Alle neuen Features brauchen Tests."
