# VoiceInvoice Proxy Server - Docker Compose
# Deploy with: docker-compose up -d

version: '3.8'

services:
  proxy-server:
    build:
      context: ../..
      dockerfile: apps/proxy-server/Dockerfile
    image: voiceinvoice/proxy-server:latest
    container_name: voiceinvoice-proxy
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3002}
      - RATE_LIMIT=${RATE_LIMIT:-60}
      - ENABLE_LOGGING=${ENABLE_LOGGING:-true}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - voiceinvoice-net

networks:
  voiceinvoice-net:
    driver: bridge
