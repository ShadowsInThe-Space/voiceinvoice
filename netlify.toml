# Netlify Configuration für Doxygen Docs
[build]
  base = "/"
  publish = "docs/api/html"
  command = "pnpm install && pnpm run docs:generate"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "8"

# Custom headers für bessere Performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects für 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
